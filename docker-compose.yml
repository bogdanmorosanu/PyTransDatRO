# ==============================================================================
# PyTransDatRO - Production 2-Container Docker Compose Stack
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # Backend: FastAPI REST Service & Pure Python Geodetic Engine
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pytransdatro-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTRANSDAT_LOG_DIR=/app/logs
    volumes:
      # Persistent host volume for SQLite usage telemetry & legacy statistics
      - ./logs:/app/logs
    expose:
      - "8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Web: Nginx Static Web Application & Reverse Proxy
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - VITE_APP_NAME=${VITE_APP_NAME:-PyTransDatRO}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
        - VITE_REPO_URL=${VITE_REPO_URL:-https://github.com/bogdanmorosanu/PyTransDatRO}
        - VITE_BATCH_WARNING_THRESHOLD=${VITE_BATCH_WARNING_THRESHOLD:-2000}
        - VITE_DEFAULT_MAP_LAT=${VITE_DEFAULT_MAP_LAT:-45.9432}
        - VITE_DEFAULT_MAP_LON=${VITE_DEFAULT_MAP_LON:-24.9668}
        - VITE_DEFAULT_MAP_ZOOM=${VITE_DEFAULT_MAP_ZOOM:-7}
    container_name: pytransdatro-web
    restart: unless-stopped
    environment:
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-50M}
    ports:
      # Host port configurable via .env (e.g., 8000 for local testing, 80/custom on remote hosts)
      - "${WEBAPP_PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
